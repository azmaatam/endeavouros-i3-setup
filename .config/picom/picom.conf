# --- Backend ---
# xrender adalah yang paling ringan untuk Intel Gen 12 kamu
backend = "xrender";

# --- Efek Visual ---
# Matikan semua yang membebani CPU/GPU
shadow = false;
fading = false;
blur-background = false;

# --- Opacity (Transparansi) ---
# Biarkan 1.0 agar CPU tidak kerja keras menghitung transparansi
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;

# --- Optimasi ---
# Mencegah screen tearing (layar robek) saat scroll
vsync = true;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true; # Sangat penting agar hanya piksel yang berubah yang di-render

# --- Tipe Jendela ---
wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 1.0; focus = true; };
};
