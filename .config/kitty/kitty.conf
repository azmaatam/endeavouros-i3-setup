shell bash -c "if [ \"\$XDG_CURRENT_DESKTOP\" = \"Hyprland\" ]; then exec zsh; else exec bash; fi"
confirm_os_window_close 0
# Font - Gunakan font yang ringan dan pasti ada
font_family      Dejavu Sans Mono
font_size        10.
window_padding_width 0 4
# Performa - Ini yang paling krusial untuk ngilangin delay
sync_to_monitor  no
repaint_delay    2
input_delay      0
sleep_detection_number 0

# Shell Integration - Kadang ini yang bikin berat di awal
shell_integration disabled

#background transparan
background_opacity 0.6
